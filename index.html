<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alumni tracker</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: #f3efe8; color: #241c15; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: 1px solid #ddd4c8; background: #fff; border-radius: 8px; padding: 0.4rem 0.7rem; }
    button.primary { background: #8c1515; color: #fff; border-color: #8c1515; }
    button.quiet { background: transparent; }
    button.active { background: #8c1515; color: #fff; border-color: #8c1515; }
    button:disabled { opacity: 0.55; cursor: default; }
    #gate { max-width: 28rem; margin: 12vh auto; padding: 1.5rem; background: #fff; border-radius: 14px; }
    #gate h1 { margin: 0 0 0.4rem; font-size: 1.6rem; }
    #gate p { color: #5c564e; }
    #gate-status { white-space: pre-wrap; }
    #gate-status.err, #banner.err, #form-error, #milestone-error { color: #8c1515; }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; padding: 0.75rem 1rem; background: #fff; border-bottom: 1px solid #e6dfd4; position: sticky; top: 0; z-index: 2; }
    .brand { font-weight: 680; margin-right: 0.4rem; }
    nav { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .who { color: #5c564e; font-size: 0.92rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; padding: 0.75rem 1rem 0; }
    #banner { margin: 0.75rem 1rem 0; padding: 0.6rem 0.75rem; border-radius: 8px; background: #fff; white-space: pre-wrap; }
    #banner.err { background: #fdecea; }
    #view { padding: 0.75rem 1rem 2rem; }
    .hint { color: #5c564e; margin: 0 0 0.75rem; }
    .board { display: flex; gap: 0.75rem; overflow-x: auto; align-items: flex-start; padding-bottom: 0.5rem; }
    .column { flex: 0 0 250px; background: #ebe4da; border-radius: 12px; padding: 0.55rem; min-height: 8rem; }
    .column h2 { margin: 0.15rem 0.35rem 0.35rem; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.01em; }
    .count { color: #6d655c; font-weight: 500; }
    .card { background: #fff; border-radius: 10px; padding: 0.65rem 0.7rem; margin-top: 0.45rem; cursor: pointer; box-shadow: 0 1px 2px rgba(40, 30, 20, 0.06); }
    .card h3 { margin: 0.15rem 0; font-size: 0.95rem; font-weight: 640; }
    .meta, .sub { color: #6d655c; font-size: 0.78rem; }
    .meta { display: flex; justify-content: space-between; gap: 0.4rem; }
    .pri-urgent { color: #8c1515; }
    .pri-high { color: #9a3412; }
    .pri-medium { color: #854d0e; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 0.5rem 0.65rem; border-bottom: 1px solid #eee6dc; vertical-align: top; }
    th { font-size: 0.78rem; color: #6d655c; background: #faf7f3; }
    tr[data-id] { cursor: pointer; }
    dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 1.5rem)); box-shadow: 0 18px 50px rgba(40, 30, 20, 0.2); }
    dialog::backdrop { background: rgba(36, 28, 21, 0.35); }
    dialog form, .setup { padding: 1rem 1.1rem 1.15rem; }
    dialog h2 { margin: 0 0 0.8rem; font-size: 1.15rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .span-2 { grid-column: 1 / -1; }
    label.field { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8rem; color: #5c564e; }
    input, select, textarea { padding: 0.45rem 0.5rem; border: 1px solid #ddd4c8; border-radius: 8px; background: #fff; color: inherit; }
    textarea { min-height: 5.5rem; resize: vertical; }
    .actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.9rem; }
    .actions .danger { margin-right: auto; color: #8c1515; }
    .children { margin: 0.3rem 0 0; padding-left: 1.1rem; }
    details.setup { margin: 1rem; background: #fff; border-radius: 12px; }
    #status { margin-top: 0.8rem; white-space: pre-wrap; }
    #status.ok { color: #21643a; }
    #status.err { color: #8c1515; }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      .span-2 { grid-column: auto; }
      header .spacer { display: none; }
    }
  </style>
</head>
<body>
  <main id="gate">
    <h1>Alumni tracker</h1>
    <p>Sign in with your Stanford alumni Google account. People appear in the assignee menu after they have signed in once.</p>
    <button id="signin" class="primary" type="button">Sign in with Google</button>
    <p id="gate-status"></p>
  </main>

  <div id="app" hidden>
    <header>
      <div class="brand">Alumni tracker</div>
      <nav>
        <button type="button" data-view="mine" class="active">My issues <span id="mine-count" class="count"></span></button>
        <button type="button" data-view="board">Board</button>
        <button type="button" data-view="list">List</button>
      </nav>
      <div class="spacer"></div>
      <div class="who" id="who"></div>
      <button id="signout" class="quiet" type="button">Sign out</button>
    </header>
    <div class="toolbar">
      <label class="field">Milestone
        <select id="milestone-filter"><option value="">All milestones</option></select>
      </label>
      <label class="field">Epic
        <select id="epic-filter"><option value="">All tickets</option></select>
      </label>
      <button id="new-ticket" class="primary" type="button">New ticket</button>
      <button id="new-epic" type="button">New epic</button>
      <button id="new-milestone" type="button">New milestone</button>
    </div>
    <div id="banner" hidden></div>
    <div id="view"></div>
  </div>

  <dialog id="editor">
    <form id="ticket-form">
      <h2 id="editor-title">Ticket</h2>
      <div class="grid">
        <label class="field span-2">Title <input id="f-title" required></label>
        <label class="field">Type
          <select id="f-type"><option value="ticket">Ticket</option><option value="epic">Epic</option></select>
        </label>
        <label class="field">Status
          <select id="f-status"></select>
        </label>
        <label class="field">Priority
          <select id="f-priority"></select>
        </label>
        <label class="field">Assignee
          <select id="f-assignee"></select>
        </label>
        <label class="field">Due date <input id="f-due" type="date"></label>
        <label class="field">Milestone
          <select id="f-milestone"></select>
        </label>
        <label class="field span-2">Epic
          <select id="f-parent"></select>
        </label>
        <label class="field span-2">Labels <input id="f-labels" placeholder="comma-separated"></label>
        <label class="field span-2">Description <textarea id="f-description"></textarea></label>
      </div>
      <div id="f-children"></div>
      <p id="form-error"></p>
      <div class="actions">
        <button id="f-delete" class="danger quiet" type="button">Delete</button>
        <button type="button" id="f-cancel">Cancel</button>
        <button class="primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="milestone-dialog">
    <form id="milestone-form">
      <h2 id="milestone-title">Milestone</h2>
      <div class="grid">
        <label class="field span-2">Name <input id="m-name" required></label>
        <label class="field">Target date <input id="m-date" type="date"></label>
        <label class="field">Status
          <select id="m-status">
            <option value="planned">Planned</option>
            <option value="active">Active</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label class="field span-2">Description <textarea id="m-description"></textarea></label>
      </div>
      <p id="milestone-error"></p>
      <div class="actions">
        <button id="m-delete" class="danger quiet" type="button" hidden>Delete</button>
        <button type="button" id="m-cancel">Cancel</button>
        <button class="primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <details class="setup">
    <summary>Database setup</summary>
    <p class="hint">Creates missing tabs and writes a header row only when that row is empty. Existing cells stay as they are.</p>
    <label>Password <input id="setup-password" type="password" autocomplete="off"></label>
    <button id="setup" type="button">Set up database</button>
    <div id="status"></div>
    <div id="result"></div>
  </details>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const CLIENT_ID = "1052608179455-k09jjr1nuadhvqkmeur124ur51oc1fnq.apps.googleusercontent.com";
    const SPREADSHEET_ID = "1gXffcczfI9JAaHS1EZbmsS_EwCm7vUdornbpG95g87s";
    const SHEETS_SCOPE = "https://www.googleapis.com/auth/spreadsheets";
    const SCOPE = SHEETS_SCOPE + " https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile";
    const ALLOWED_ORIGINS = ["https://sdaswani.github.io", "http://localhost:5173"];
    const SETUP_PASSWORD_SHA256 = "27845b1a8d8d2e025b559ed2e66826d66b29bf3d6570969921f7549599e65e65";
    const USER_HEADERS = ["id", "email", "name", "created_at", "last_seen"];
    const SCHEMA = [
      { title: "Tickets", headers: ["id", "number", "type", "parent_id", "milestone_id", "title", "description", "status", "priority", "assignee", "labels", "created_at", "created_by", "updated_at", "updated_by", "deleted_at"] },
      { title: "Milestones", headers: ["id", "name", "target_date", "description", "status", "created_at", "created_by", "updated_at", "updated_by", "deleted_at"] },
      { title: "Users", headers: USER_HEADERS },
      { title: "Fields", headers: ["id", "entity", "key", "label", "type", "options", "position"] },
      { title: "FieldValues", headers: ["id", "entity", "entity_id", "field_id", "value", "updated_at"] },
      { title: "_meta", headers: ["key", "value"] },
    ];
    const STATUSES = [
      ["backlog", "Backlog"],
      ["todo", "Todo"],
      ["in_progress", "In progress"],
      ["done", "Done"],
      ["canceled", "Canceled"],
    ];
    const PRIORITIES = [
      ["urgent", "Urgent"],
      ["high", "High"],
      ["medium", "Medium"],
      ["low", "Low"],
      ["none", "None"],
    ];
    const STATUS_LABEL = Object.fromEntries(STATUSES);
    const PRIORITY_LABEL = Object.fromEntries(PRIORITIES);

    const state = {
      token: "",
      email: "",
      name: "",
      tickets: [],
      milestones: [],
      users: [],
      headers: { Tickets: [], Milestones: [], Users: [] },
      view: "mine",
      milestoneId: "",
      epicId: "",
      saving: false,
      draft: null,
      milestoneDraft: null,
      suppressClick: false,
    };

    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const button = document.getElementById("signin");
    const setupButton = document.getElementById("setup");
    const passwordInput = document.getElementById("setup-password");
    const gateEl = document.getElementById("gate");
    const appEl = document.getElementById("app");
    const viewEl = document.getElementById("view");
    const bannerEl = document.getElementById("banner");
    const gateStatusEl = document.getElementById("gate-status");

    function setStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = kind || "";
    }

    function setBanner(message, kind) {
      bannerEl.textContent = message || "";
      bannerEl.className = kind || "";
      bannerEl.hidden = !message;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function columnName(count) {
      let name = "";
      let n = count;
      while (n > 0) {
        const remainder = (n - 1) % 26;
        name = String.fromCharCode(65 + remainder) + name;
        n = Math.floor((n - 1) / 26);
      }
      return name;
    }

    function cellsOf(row) {
      const cells = (row || []).map((cell) => String(cell));
      while (cells.length && cells[cells.length - 1] === "") cells.pop();
      return cells;
    }

    function rowEmpty(row) {
      return cellsOf(row).length === 0;
    }

    function sameHeaders(row, expected) {
      const cells = cellsOf(row);
      if (cells.length < expected.length) return false;
      return expected.every((header, index) => cells[index] === header);
    }

    function rangeOf(title, a1) {
      return "'" + title.replaceAll("'", "''") + "'!" + a1;
    }

    function sameEmail(a, b) {
      return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
    }

    function todayKey() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return now.getFullYear() + "-" + month + "-" + day;
    }

    function dateKey(value) {
      const text = String(value || "").slice(0, 10);
      return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : "";
    }

    function formatDay(value) {
      const key = dateKey(value);
      if (!key) return "";
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function rowFrom(headers, record) {
      return headers.map((name) => record[name] ?? "");
    }

    function recordFrom(headers, row, rowNumber) {
      const record = { _row: rowNumber };
      headers.forEach((name, index) => {
        record[name] = row[index] != null ? String(row[index]) : "";
      });
      record._loadedUpdatedAt = record.updated_at || "";
      return record;
    }

    const SESSION_COOKIE = "sattracker_session";

    function cookiePath() {
      return location.hostname.endsWith("github.io") ? "/sattracker" : "/";
    }

    function writeCookie(value, maxAge) {
      const secure = location.protocol === "https:" ? "; Secure" : "";
      document.cookie = SESSION_COOKIE + "=" + value + "; Max-Age=" + maxAge + "; Path=" + cookiePath() + "; SameSite=Lax" + secure;
    }

    function clearSession() {
      writeCookie("", 0);
    }

    function readSession() {
      const prefix = SESSION_COOKIE + "=";
      const raw = document.cookie.split("; ").find((part) => part.startsWith(prefix));
      if (!raw) return null;
      try {
        const session = JSON.parse(decodeURIComponent(raw.slice(prefix.length)));
        if (!session.access_token || !session.expires_at || session.expires_at <= Date.now()) {
          clearSession();
          return null;
        }
        if (!String(session.scope || "").includes(SHEETS_SCOPE)) {
          clearSession();
          return null;
        }
        return session;
      } catch (error) {
        clearSession();
        return null;
      }
    }

    function saveSession(response) {
      const seconds = Math.max(60, Number(response.expires_in || 3600) - 60);
      writeCookie(encodeURIComponent(JSON.stringify({
        access_token: response.access_token,
        scope: response.scope || "",
        expires_at: Date.now() + seconds * 1000,
      })), seconds);
    }

    async function passwordMatches(input) {
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(input));
      const hex = [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
      return hex === SETUP_PASSWORD_SHA256;
    }

    async function sheets(path, token, { method = "GET", body } = {}) {
      const response = await fetch("https://sheets.googleapis.com/v4/spreadsheets/" + path, {
        method,
        headers: {
          Authorization: "Bearer " + token,
          ...(body ? { "Content-Type": "application/json" } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const message = payload.error?.message || response.statusText;
        throw new Error(response.status + " " + message);
      }
      return payload;
    }

    async function putValues(token, a1Range, values) {
      return sheets(SPREADSHEET_ID + "/values/" + encodeURIComponent(a1Range) + "?valueInputOption=RAW", token, {
        method: "PUT",
        body: { values },
      });
    }

    async function appendValues(token, title, values) {
      const range = rangeOf(title, "A1");
      return sheets(SPREADSHEET_ID + "/values/" + encodeURIComponent(range) + ":append?valueInputOption=RAW&insertDataOption=INSERT_ROWS", token, {
        method: "POST",
        body: { values },
      });
    }

    async function spreadsheetProperties(token) {
      const meta = await sheets(SPREADSHEET_ID + "?fields=sheets.properties", token);
      return new Map((meta.sheets || []).map((sheet) => [sheet.properties.title, sheet.properties]));
    }

    async function setupDatabase(token) {
      setStatus("Signed in. Checking the spreadsheet…");
      const notes = [];
      let properties = await spreadsheetProperties(token);
      const missing = SCHEMA.filter((sheet) => !properties.has(sheet.title));
      if (missing.length) {
        await sheets(SPREADSHEET_ID + ":batchUpdate", token, {
          method: "POST",
          body: {
            requests: missing.map((sheet) => ({
              addSheet: { properties: { title: sheet.title, gridProperties: { frozenRowCount: 1 } } },
            })),
          },
        });
        missing.forEach((sheet) => notes.push("Created tab " + sheet.title + "."));
        properties = await spreadsheetProperties(token);
      }

      const ranges = SCHEMA.map((sheet) => rangeOf(sheet.title, "A1:Z1"));
      ranges.push(rangeOf("_meta", "A1:B50"));
      const query = ranges.map((range) => "ranges=" + encodeURIComponent(range)).join("&");
      const got = await sheets(SPREADSHEET_ID + "/values:batchGet?" + query, token);
      const valueRanges = got.valueRanges || [];
      const writes = [];
      const readyTitles = [];

      SCHEMA.forEach((sheet, index) => {
        const header = valueRanges[index]?.values?.[0];
        if (rowEmpty(header)) {
          const end = columnName(sheet.headers.length);
          writes.push({ range: rangeOf(sheet.title, "A1:" + end + "1"), values: [sheet.headers] });
          notes.push("Wrote headers on " + sheet.title + ".");
          readyTitles.push(sheet.title);
          return;
        }
        if (sameHeaders(header, sheet.headers)) {
          notes.push(sheet.title + " headers already match.");
          readyTitles.push(sheet.title);
          return;
        }
        notes.push("Skipped " + sheet.title + ": the header row is different, so its cells were left alone.");
      });

      if (readyTitles.includes("_meta")) {
        const metaRows = valueRanges[SCHEMA.length]?.values || [];
        const existing = metaRows.slice(1).find((row) => String(row[0] || "") === "schema_version");
        if (!existing) {
          const target = metaRows.length === 0 ? 2 : metaRows.length + 1;
          writes.push({ range: rangeOf("_meta", "A" + target + ":B" + target), values: [["schema_version", "1"]] });
          notes.push("Set schema_version to 1.");
        } else if (String(existing[1] ?? "") === "1") {
          notes.push("schema_version is already 1.");
        } else {
          notes.push("Left schema_version at " + existing[1] + ".");
        }
      }

      if (writes.length) {
        await sheets(SPREADSHEET_ID + "/values:batchUpdate", token, {
          method: "POST",
          body: { valueInputOption: "RAW", data: writes },
        });
      }

      const formatRequests = readyTitles.map((title) => properties.get(title)?.sheetId).filter((id) => id !== undefined).flatMap((sheetId) => ([
        {
          updateSheetProperties: {
            properties: { sheetId, gridProperties: { frozenRowCount: 1 } },
            fields: "gridProperties.frozenRowCount",
          },
        },
        {
          repeatCell: {
            range: { sheetId, startRowIndex: 0, endRowIndex: 1 },
            cell: { userEnteredFormat: { textFormat: { bold: true } } },
            fields: "userEnteredFormat.textFormat.bold",
          },
        },
      ]));
      if (formatRequests.length) {
        await sheets(SPREADSHEET_ID + ":batchUpdate", token, {
          method: "POST",
          body: { requests: formatRequests },
        });
      }

      const skipped = notes.some((note) => note.startsWith("Skipped"));
      setStatus(skipped ? "Setup finished, with some tabs left unchanged." : "Database setup finished. No existing data rows were changed.", skipped ? "err" : "ok");
      resultEl.innerHTML = "<ul>" + notes.map((note) => "<li>" + escapeHtml(note) + "</li>").join("") + "</ul>";
    }

    async function currentProfile(token) {
      const response = await fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
        headers: { Authorization: "Bearer " + token },
      });
      if (!response.ok) return { email: "", name: "" };
      const profile = await response.json();
      const name = profile.name || [profile.given_name, profile.family_name].filter(Boolean).join(" ");
      return { email: profile.email || "", name: name || "" };
    }

    async function ensureSheet(token, title, headers) {
      const properties = await spreadsheetProperties(token);
      if (!properties.has(title)) {
        await sheets(SPREADSHEET_ID + ":batchUpdate", token, {
          method: "POST",
          body: {
            requests: [{ addSheet: { properties: { title, gridProperties: { frozenRowCount: 1 } } } }],
          },
        });
      }
      const got = await sheets(SPREADSHEET_ID + "/values/" + encodeURIComponent(rangeOf(title, "A1:Z1")), token);
      let cells = cellsOf(got.values?.[0]);
      if (!cells.length) {
        await putValues(token, rangeOf(title, "A1:" + columnName(headers.length) + "1"), [headers]);
        cells = headers.slice();
      }
      return cells;
    }

    async function ensureHeader(token, title, cells, name) {
      if (cells.includes(name)) return cells;
      const next = cells.concat(name);
      await putValues(token, rangeOf(title, "A1:" + columnName(next.length) + "1"), [next]);
      return next;
    }

    async function loadRecords(token, title, headers) {
      const end = columnName(Math.max(headers.length, 1));
      const got = await sheets(SPREADSHEET_ID + "/values/" + encodeURIComponent(rangeOf(title, "A2:" + end)), token);
      return (got.values || []).map((row, index) => rowEmpty(row) ? null : recordFrom(headers, row, index + 2)).filter(Boolean);
    }

    async function readRecord(token, title, headers, rowNumber) {
      const end = columnName(Math.max(headers.length, 1));
      const got = await sheets(SPREADSHEET_ID + "/values/" + encodeURIComponent(rangeOf(title, "A" + rowNumber + ":" + end + rowNumber)), token);
      return recordFrom(headers, got.values?.[0] || [], rowNumber);
    }

    async function rememberUser(token, profile) {
      if (!profile.email) return;
      const headers = await ensureSheet(token, "Users", USER_HEADERS);
      if (!headers.includes("email")) throw new Error("The Users tab is missing an email column.");
      const users = await loadRecords(token, "Users", headers);
      const now = nowIso();
      const existing = users.find((user) => sameEmail(user.email, profile.email) && !user.deleted_at);
      if (!existing) {
        await appendValues(token, "Users", [rowFrom(headers, {
          id: crypto.randomUUID(),
          email: profile.email,
          name: profile.name || "",
          created_at: now,
          last_seen: now,
        })]);
        return;
      }
      existing.name = profile.name || existing.name || "";
      existing.last_seen = now;
      await putValues(token, rangeOf("Users", "A" + existing._row + ":" + columnName(headers.length) + existing._row), [rowFrom(headers, existing)]);
    }

    async function reloadData() {
      const ticketHeaders = await ensureHeader(state.token, "Tickets", await ensureSheet(state.token, "Tickets", SCHEMA.find((sheet) => sheet.title === "Tickets").headers), "due_date");
      const milestoneHeaders = await ensureSheet(state.token, "Milestones", SCHEMA.find((sheet) => sheet.title === "Milestones").headers);
      const userHeaders = await ensureSheet(state.token, "Users", USER_HEADERS);
      state.headers = { Tickets: ticketHeaders, Milestones: milestoneHeaders, Users: userHeaders };
      state.tickets = await loadRecords(state.token, "Tickets", ticketHeaders);
      state.milestones = await loadRecords(state.token, "Milestones", milestoneHeaders);
      state.users = await loadRecords(state.token, "Users", userHeaders);
    }

    function dataStamp() {
      const tickets = state.tickets.map((ticket) => [ticket.id, ticket.updated_at, ticket.deleted_at, ticket.title, ticket.status, ticket.assignee, ticket.due_date, ticket.milestone_id, ticket.parent_id, ticket.priority, ticket.number, ticket.type, ticket.labels].join("\t")).join("\n");
      const milestones = state.milestones.map((milestone) => [milestone.id, milestone.updated_at, milestone.deleted_at, milestone.name, milestone.target_date, milestone.status].join("\t")).join("\n");
      const users = state.users.map((user) => [user.email, user.name].join("\t")).join("\n");
      return tickets + "\n--\n" + milestones + "\n--\n" + users;
    }

    function viewIsBusy() {
      return state.saving || state.dragging || document.getElementById("editor").open || document.getElementById("milestone-dialog").open;
    }

    async function refreshQuietly() {
      if (!state.token || !state.headers.Tickets.length || viewIsBusy()) return;
      const before = dataStamp();
      const titles = ["Tickets", "Milestones", "Users"];
      const query = titles.map((title) => "ranges=" + encodeURIComponent(rangeOf(title, "A2:" + columnName(Math.max(state.headers[title].length, 1))))).join("&");
      let got;
      try {
        got = await sheets(SPREADSHEET_ID + "/values:batchGet?" + query, state.token);
      } catch (error) {
        if (String(error.message).startsWith("401")) onSessionExpired();
        return;
      }
      if (viewIsBusy()) return;
      const valueRanges = got.valueRanges || [];
      titles.forEach((title, index) => {
        const headers = state.headers[title];
        state[title === "Tickets" ? "tickets" : title === "Milestones" ? "milestones" : "users"] = (valueRanges[index]?.values || []).map((row, rowIndex) => rowEmpty(row) ? null : recordFrom(headers, row, rowIndex + 2)).filter(Boolean);
      });
      if (dataStamp() === before) return;
      const board = viewEl.querySelector(".board");
      const scrollLeft = board ? board.scrollLeft : 0;
      render();
      const nextBoard = viewEl.querySelector(".board");
      if (nextBoard) nextBoard.scrollLeft = scrollLeft;
    }

    let pollTimer = 0;
    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(refreshQuietly, 15000);
    }

    function stopPolling() {
      clearInterval(pollTimer);
      pollTimer = 0;
    }

    let onSessionExpired = () => {};

    function activeMilestones() {
      return state.milestones.filter((milestone) => !milestone.deleted_at).sort((a, b) => (a.target_date || "9999").localeCompare(b.target_date || "9999") || a.name.localeCompare(b.name));
    }

    function knownUsers() {
      const seen = new Set();
      return state.users.filter((user) => {
        const email = String(user.email || "").trim();
        if (!email) return false;
        const key = email.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email));
    }

    function userLabel(email) {
      if (!email) return "";
      const user = knownUsers().find((item) => sameEmail(item.email, email));
      return user?.name || email;
    }

    function milestoneName(id) {
      return state.milestones.find((milestone) => milestone.id === id && !milestone.deleted_at)?.name || "";
    }

    function epicName(id) {
      return state.tickets.find((ticket) => ticket.id === id && ticket.type === "epic" && !ticket.deleted_at)?.title || "";
    }

    function epicsInView() {
      const ids = new Set();
      state.tickets.forEach((ticket) => {
        if (ticket.deleted_at) return;
        if (state.milestoneId && ticket.milestone_id !== state.milestoneId) return;
        if (ticket.type === "epic" && ticket.id) ids.add(ticket.id);
        if (ticket.parent_id) ids.add(ticket.parent_id);
      });
      return state.tickets.filter((ticket) => ticket.type === "epic" && ticket.id && !ticket.deleted_at && ids.has(ticket.id))
        .sort((a, b) => (a.title || "").localeCompare(b.title || ""));
    }

    function visibleTickets() {
      return state.tickets.filter((ticket) => {
        if (ticket.deleted_at) return false;
        if (state.milestoneId && ticket.milestone_id !== state.milestoneId) return false;
        if (state.epicId && ticket.id !== state.epicId && ticket.parent_id !== state.epicId) return false;
        if (state.view === "mine" && !sameEmail(ticket.assignee, state.email)) return false;
        if (state.view === "mine" && (ticket.status === "done" || ticket.status === "canceled")) return false;
        return true;
      });
    }

    function compareDue(a, b) {
      return (dateKey(a.due_date) || "9999-99-99").localeCompare(dateKey(b.due_date) || "9999-99-99") || Number(a.number) - Number(b.number);
    }

    function cardHtml(ticket, includeStatus) {
      const parts = [];
      if (ticket.type === "epic") parts.push("Epic");
      if (includeStatus) parts.push(STATUS_LABEL[ticket.status] || ticket.status || "Backlog");
      const epic = epicName(ticket.parent_id);
      if (epic) parts.push(epic);
      const milestone = milestoneName(ticket.milestone_id);
      if (milestone) parts.push(milestone);
      if (state.view !== "mine" && ticket.assignee) parts.push(userLabel(ticket.assignee));
      const due = formatDay(ticket.due_date);
      if (due && state.view !== "mine") parts.push(due);
      return '<article class="card" draggable="' + (state.view === "board" ? "true" : "false") + '" data-id="' + escapeHtml(ticket.id) + '">' +
        '<div class="meta"><span>#' + escapeHtml(ticket.number || "—") + '</span><span class="pri-' + escapeHtml(ticket.priority || "none") + '">' + escapeHtml(PRIORITY_LABEL[ticket.priority] || "None") + '</span></div>' +
        "<h3>" + escapeHtml(ticket.title || "Untitled") + "</h3>" +
        '<p class="sub">' + escapeHtml(parts.join(" · ")) + "</p></article>";
    }

    function renderBoard(tickets) {
      const columns = STATUSES.map(([id, label]) => {
        const items = tickets.filter((ticket) => (ticket.status || "backlog") === id);
        return '<section class="column" data-status="' + id + '"><h2>' + label + ' <span class="count">' + items.length + "</span></h2>" +
          items.map((ticket) => cardHtml(ticket, false)).join("") + "</section>";
      }).join("");
      viewEl.innerHTML = '<div class="board">' + columns + "</div>";
    }

    function renderMine(tickets) {
      const today = todayKey();
      const groups = [
        ["overdue", "Overdue", (ticket) => dateKey(ticket.due_date) && dateKey(ticket.due_date) < today],
        ["today", "Today", (ticket) => dateKey(ticket.due_date) === today],
        ["upcoming", "Upcoming", (ticket) => dateKey(ticket.due_date) > today],
        ["none", "No due date", (ticket) => !dateKey(ticket.due_date)],
      ];
      const columns = groups.map(([id, label, test]) => {
        const items = tickets.filter(test).sort(compareDue);
        return '<section class="column"><h2>' + label + ' <span class="count">' + items.length + "</span></h2>" +
          (items.length ? items.map((ticket) => cardHtml(ticket, true)).join("") : '<p class="sub">None</p>') + "</section>";
      }).join("");
      viewEl.innerHTML = '<p class="hint">Open tickets assigned to ' + escapeHtml(state.email || "you") + ", grouped by due date. Done and canceled items stay on the board.</p>" +
        '<div class="board">' + columns + "</div>";
    }

    function renderList(tickets) {
      const rows = tickets.sort((a, b) => Number(a.number) - Number(b.number)).map((ticket) =>
        "<tr data-id=\"" + escapeHtml(ticket.id) + "\"><td>#" + escapeHtml(ticket.number || "—") + "</td><td>" + escapeHtml(ticket.title || "Untitled") +
        "</td><td>" + escapeHtml(ticket.type || "ticket") + "</td><td>" + escapeHtml(STATUS_LABEL[ticket.status] || ticket.status) +
        "</td><td>" + escapeHtml(PRIORITY_LABEL[ticket.priority] || "") + "</td><td>" + escapeHtml(userLabel(ticket.assignee)) +
        "</td><td>" + escapeHtml(formatDay(ticket.due_date)) + "</td><td>" + escapeHtml(milestoneName(ticket.milestone_id)) +
        "</td><td>" + escapeHtml(epicName(ticket.parent_id)) + "</td></tr>"
      ).join("");
      viewEl.innerHTML = "<table><thead><tr><th>#</th><th>Title</th><th>Type</th><th>Status</th><th>Priority</th><th>Assignee</th><th>Due</th><th>Milestone</th><th>Epic</th></tr></thead><tbody>" +
        (rows || '<tr><td colspan="9">No tickets yet.</td></tr>') + "</tbody></table>";
    }

    function render() {
      document.getElementById("who").textContent = state.name ? state.name + " · " + state.email : state.email;
      document.querySelectorAll("[data-view]").forEach((item) => item.classList.toggle("active", item.dataset.view === state.view));
      const mineTotal = state.tickets.filter((ticket) => !ticket.deleted_at && sameEmail(ticket.assignee, state.email) && ticket.status !== "done" && ticket.status !== "canceled").length;
      document.getElementById("mine-count").textContent = mineTotal ? "(" + mineTotal + ")" : "";
      const filter = document.getElementById("milestone-filter");
      const selected = state.milestoneId;
      filter.innerHTML = '<option value="">All milestones</option>' + activeMilestones().map((milestone) =>
        '<option value="' + escapeHtml(milestone.id) + '">' + escapeHtml(milestone.name || "Untitled") + (milestone.target_date ? " · " + escapeHtml(formatDay(milestone.target_date)) : "") + "</option>"
      ).join("");
      filter.value = selected;
      if (filter.value !== selected) state.milestoneId = "";
      const epicFilter = document.getElementById("epic-filter");
      const selectedEpic = state.epicId;
      epicFilter.innerHTML = '<option value="">All tickets</option>' + epicsInView().map((epic) =>
        '<option value="' + escapeHtml(epic.id) + '">' + escapeHtml(epic.title || "Untitled") + "</option>"
      ).join("");
      epicFilter.value = selectedEpic;
      if (epicFilter.value !== selectedEpic) state.epicId = "";
      const tickets = visibleTickets();
      if (!state.headers.Tickets.length) {
        viewEl.innerHTML = '<p class="hint">The Tickets tab is missing. Open Database setup below and run it once.</p>';
        return;
      }
      if (state.view === "mine") renderMine(tickets);
      else if (state.view === "list") renderList(tickets);
      else renderBoard(tickets);
    }

    function optionsHtml(pairs, selected) {
      return pairs.map(([value, label]) => '<option value="' + escapeHtml(value) + '"' + (value === selected ? " selected" : "") + ">" + escapeHtml(label) + "</option>").join("");
    }

    function fillTicketForm(ticket) {
      document.getElementById("editor-title").textContent = ticket._row ? (ticket.type === "epic" ? "Epic" : "Ticket") + " #" + (ticket.number || "") : (ticket.type === "epic" ? "New epic" : "New ticket");
      document.getElementById("f-title").value = ticket.title || "";
      document.getElementById("f-type").value = ticket.type === "epic" ? "epic" : "ticket";
      document.getElementById("f-status").innerHTML = optionsHtml(STATUSES, ticket.status || "backlog");
      document.getElementById("f-priority").innerHTML = optionsHtml(PRIORITIES, ticket.priority || "none");
      const users = knownUsers();
      const assigneePairs = [["", "Unassigned"]].concat(users.map((user) => [user.email, user.name ? user.name + " (" + user.email + ")" : user.email]));
      if (ticket.assignee && !users.some((user) => sameEmail(user.email, ticket.assignee))) assigneePairs.push([ticket.assignee, ticket.assignee]);
      document.getElementById("f-assignee").innerHTML = optionsHtml(assigneePairs, ticket.assignee || "");
      document.getElementById("f-due").value = dateKey(ticket.due_date);
      const milestonePairs = [["", "None"]].concat(activeMilestones().map((milestone) => [milestone.id, milestone.name || "Untitled"]));
      document.getElementById("f-milestone").innerHTML = optionsHtml(milestonePairs, ticket.milestone_id || "");
      const epics = state.tickets.filter((item) => item.type === "epic" && !item.deleted_at && item.id !== ticket.id);
      const parentPairs = [["", "None"]].concat(epics.map((epic) => [epic.id, epic.title || "Untitled"]));
      document.getElementById("f-parent").innerHTML = optionsHtml(parentPairs, ticket.parent_id || "");
      document.getElementById("f-parent").disabled = ticket.type === "epic";
      document.getElementById("f-labels").value = ticket.labels || "";
      document.getElementById("f-description").value = ticket.description || "";
      const children = ticket.id && ticket.type === "epic"
        ? state.tickets.filter((item) => item.parent_id === ticket.id && !item.deleted_at)
        : [];
      document.getElementById("f-children").innerHTML = children.length ? "<p class=\"sub\">Tickets in this epic</p><ul class=\"children\">" + children.map((child) => "<li>#" + escapeHtml(child.number || "—") + " " + escapeHtml(child.title || "Untitled") + "</li>").join("") + "</ul>" : "";
      document.getElementById("f-delete").hidden = !ticket._row;
      document.getElementById("form-error").textContent = "";
    }

    function openTicket(ticket) {
      state.draft = ticket;
      fillTicketForm(ticket);
      document.getElementById("editor").showModal();
    }

    function blankTicket(type) {
      return {
        id: "",
        number: "",
        type: type || "ticket",
        parent_id: "",
        milestone_id: state.milestoneId || "",
        title: "",
        description: "",
        status: "todo",
        priority: "none",
        assignee: type === "ticket" ? state.email : "",
        labels: "",
        due_date: "",
        created_at: "",
        created_by: "",
        updated_at: "",
        updated_by: "",
        deleted_at: "",
        _row: null,
        _loadedUpdatedAt: "",
      };
    }

    function nextNumber() {
      let max = 0;
      state.tickets.forEach((ticket) => {
        const value = Number(ticket.number);
        if (Number.isFinite(value) && value > max) max = value;
      });
      return String(max + 1);
    }

    function ticketFromForm() {
      const draft = state.draft;
      const type = document.getElementById("f-type").value === "epic" ? "epic" : "ticket";
      const now = nowIso();
      return {
        id: draft.id || crypto.randomUUID(),
        number: draft.number || nextNumber(),
        type,
        parent_id: type === "epic" ? "" : document.getElementById("f-parent").value,
        milestone_id: document.getElementById("f-milestone").value,
        title: document.getElementById("f-title").value.trim(),
        description: document.getElementById("f-description").value,
        status: document.getElementById("f-status").value,
        priority: document.getElementById("f-priority").value,
        assignee: document.getElementById("f-assignee").value,
        labels: document.getElementById("f-labels").value.trim(),
        due_date: document.getElementById("f-due").value,
        created_at: draft.created_at || now,
        created_by: draft.created_by || state.email,
        updated_at: now,
        updated_by: state.email,
        deleted_at: draft.deleted_at || "",
        _row: draft._row,
        _loadedUpdatedAt: draft._loadedUpdatedAt || "",
      };
    }

    async function writeTicket(record) {
      const headers = state.headers.Tickets;
      const values = [rowFrom(headers, record)];
      if (record._row) {
        const fresh = await readRecord(state.token, "Tickets", headers, record._row);
        if (fresh.id && fresh.id !== record.id) throw new Error("This row no longer matches the ticket. Reload and try again.");
        if ((fresh.updated_at || "") !== (record._loadedUpdatedAt || "")) throw new Error("Someone else saved this ticket. Reload and try again.");
        await putValues(state.token, rangeOf("Tickets", "A" + record._row + ":" + columnName(headers.length) + record._row), values);
      } else {
        await appendValues(state.token, "Tickets", values);
      }
    }

    async function saveTicket(event) {
      event.preventDefault();
      const record = ticketFromForm();
      if (!record.title) {
        document.getElementById("form-error").textContent = "A title is required.";
        return;
      }
      document.getElementById("form-error").textContent = "";
      state.saving = true;
      try {
        await writeTicket(record);
        document.getElementById("editor").close();
        await reloadData();
        render();
      } catch (error) {
        document.getElementById("form-error").textContent = error.message;
      } finally {
        state.saving = false;
      }
    }

    async function deleteTicket() {
      const draft = state.draft;
      if (!draft?._row) return;
      const record = ticketFromForm();
      record.deleted_at = nowIso();
      record.updated_at = record.deleted_at;
      record.updated_by = state.email;
      state.saving = true;
      try {
        await writeTicket(record);
        document.getElementById("editor").close();
        await reloadData();
        render();
      } catch (error) {
        document.getElementById("form-error").textContent = error.message;
      } finally {
        state.saving = false;
      }
    }

    async function changeStatus(ticket, status) {
      const now = nowIso();
      const record = { ...ticket, status, updated_at: now, updated_by: state.email };
      state.saving = true;
      try {
        await writeTicket(record);
        await reloadData();
        render();
      } catch (error) {
        setBanner(error.message, "err");
        await reloadData().catch(() => {});
        render();
      } finally {
        state.saving = false;
      }
    }

    function openMilestone(milestone) {
      state.milestoneDraft = milestone;
      document.getElementById("milestone-title").textContent = milestone._row ? "Milestone" : "New milestone";
      document.getElementById("m-name").value = milestone.name || "";
      document.getElementById("m-date").value = dateKey(milestone.target_date);
      document.getElementById("m-status").value = milestone.status || "planned";
      document.getElementById("m-description").value = milestone.description || "";
      document.getElementById("m-delete").hidden = !milestone._row;
      document.getElementById("milestone-error").textContent = "";
      document.getElementById("milestone-dialog").showModal();
    }

    function milestoneFromForm() {
      const draft = state.milestoneDraft || {};
      const now = nowIso();
      return {
        id: draft.id || crypto.randomUUID(),
        name: document.getElementById("m-name").value.trim(),
        target_date: document.getElementById("m-date").value,
        description: document.getElementById("m-description").value,
        status: document.getElementById("m-status").value,
        created_at: draft.created_at || now,
        created_by: draft.created_by || state.email,
        updated_at: now,
        updated_by: state.email,
        deleted_at: draft.deleted_at || "",
        _row: draft._row,
        _loadedUpdatedAt: draft._loadedUpdatedAt || "",
      };
    }

    async function writeMilestone(record) {
      const headers = state.headers.Milestones;
      const values = [rowFrom(headers, record)];
      if (record._row) {
        const fresh = await readRecord(state.token, "Milestones", headers, record._row);
        if (fresh.id && fresh.id !== record.id) throw new Error("This row no longer matches the milestone. Reload and try again.");
        if ((fresh.updated_at || "") !== (record._loadedUpdatedAt || "")) throw new Error("Someone else saved this milestone. Reload and try again.");
        await putValues(state.token, rangeOf("Milestones", "A" + record._row + ":" + columnName(headers.length) + record._row), values);
      } else {
        await appendValues(state.token, "Milestones", values);
      }
    }

    async function saveMilestone(event) {
      event.preventDefault();
      const record = milestoneFromForm();
      if (!record.name) {
        document.getElementById("milestone-error").textContent = "A name is required.";
        return;
      }
      state.saving = true;
      try {
        await writeMilestone(record);
        document.getElementById("milestone-dialog").close();
        await reloadData();
        render();
      } catch (error) {
        document.getElementById("milestone-error").textContent = error.message;
      } finally {
        state.saving = false;
      }
    }

    async function deleteMilestone() {
      if (!state.milestoneDraft?._row) return;
      const record = milestoneFromForm();
      record.deleted_at = nowIso();
      record.updated_at = record.deleted_at;
      state.saving = true;
      try {
        await writeMilestone(record);
        if (state.milestoneId === record.id) state.milestoneId = "";
        document.getElementById("milestone-dialog").close();
        await reloadData();
        render();
      } catch (error) {
        document.getElementById("milestone-error").textContent = error.message;
      } finally {
        state.saving = false;
      }
    }

    async function enterApp(token) {
      state.token = token;
      gateEl.hidden = true;
      appEl.hidden = false;
      setBanner("Loading the tracker…");
      const profile = await currentProfile(token);
      state.email = profile.email;
      state.name = profile.name;
      try {
        await rememberUser(token, profile);
      } catch (error) {
        setBanner(error.message, "err");
      }
      await reloadData();
      setBanner("");
      render();
      startPolling();
    }

    function showAuthError(message) {
      if (appEl.hidden) {
        gateStatusEl.textContent = message;
        gateStatusEl.className = "err";
      } else {
        setBanner(message, "err");
      }
    }

    function signOut() {
      stopPolling();
      clearSession();
      state.token = "";
      appEl.hidden = true;
      gateEl.hidden = false;
      gateStatusEl.textContent = "";
    }

    function bindApp() {
      document.querySelectorAll("[data-view]").forEach((item) => {
        item.addEventListener("click", () => {
          state.view = item.dataset.view;
          setBanner("");
          render();
        });
      });
      document.getElementById("milestone-filter").addEventListener("change", (event) => {
        state.milestoneId = event.target.value;
        render();
      });
      document.getElementById("epic-filter").addEventListener("change", (event) => {
        state.epicId = event.target.value;
        render();
      });
      document.getElementById("new-ticket").addEventListener("click", () => openTicket(blankTicket("ticket")));
      document.getElementById("new-epic").addEventListener("click", () => openTicket(blankTicket("epic")));
      document.getElementById("new-milestone").addEventListener("click", () => openMilestone({ status: "planned" }));
      document.getElementById("signout").addEventListener("click", signOut);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshQuietly();
      });
      document.getElementById("ticket-form").addEventListener("submit", saveTicket);
      document.getElementById("f-cancel").addEventListener("click", () => document.getElementById("editor").close());
      document.getElementById("f-delete").addEventListener("click", deleteTicket);
      document.getElementById("f-type").addEventListener("change", () => {
        document.getElementById("f-parent").disabled = document.getElementById("f-type").value === "epic";
        if (document.getElementById("f-type").value === "epic") document.getElementById("f-parent").value = "";
      });
      document.getElementById("milestone-form").addEventListener("submit", saveMilestone);
      document.getElementById("m-cancel").addEventListener("click", () => document.getElementById("milestone-dialog").close());
      document.getElementById("m-delete").addEventListener("click", deleteMilestone);
      viewEl.addEventListener("click", (event) => {
        if (state.suppressClick) return;
        const row = event.target.closest("[data-id]");
        if (!row) return;
        const ticket = state.tickets.find((item) => item.id === row.dataset.id);
        if (ticket) openTicket(ticket);
      });
      viewEl.addEventListener("dragstart", (event) => {
        const card = event.target.closest(".card");
        if (!card || state.view !== "board") return;
        event.dataTransfer.setData("text/plain", card.dataset.id);
        event.dataTransfer.effectAllowed = "move";
        state.dragging = card.dataset.id;
      });
      viewEl.addEventListener("dragend", () => {
        state.dragging = "";
        state.suppressClick = true;
        setTimeout(() => { state.suppressClick = false; }, 50);
      });
      viewEl.addEventListener("dragover", (event) => {
        if (state.view !== "board" || !event.target.closest("[data-status]")) return;
        event.preventDefault();
      });
      viewEl.addEventListener("drop", (event) => {
        const column = event.target.closest("[data-status]");
        if (!column || state.view !== "board") return;
        event.preventDefault();
        const id = event.dataTransfer.getData("text/plain") || state.dragging;
        const ticket = state.tickets.find((item) => item.id === id);
        if (!ticket || (ticket.status || "backlog") === column.dataset.status) return;
        changeStatus(ticket, column.dataset.status);
      });
    }

    function start() {
      if (!window.google?.accounts?.oauth2) {
        setTimeout(start, 50);
        return;
      }
      if (!ALLOWED_ORIGINS.includes(location.origin)) {
        const message = "Open https://sdaswani.github.io/sattracker/ so Google sign-in can run. This page is " + location.origin + ".";
        gateStatusEl.textContent = message;
        gateStatusEl.className = "err";
        button.disabled = true;
        setupButton.disabled = true;
        return;
      }
      let nextAction = "read";
      let needConsent = false;
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: (response) => {
          if (response.error) {
            showAuthError("Google sign-in failed: " + response.error);
            return;
          }
          const granted = response.scope || "";
          if (!granted.includes(SHEETS_SCOPE)) {
            needConsent = true;
            showAuthError("Google did not grant Sheets access. Click Sign in again and allow it.");
            return;
          }
          needConsent = false;
          saveSession(response);
          const job = nextAction === "setup" ? setupDatabase : enterApp;
          job(response.access_token).catch((error) => {
            if (String(error.message).startsWith("401")) {
              sessionExpired();
              return;
            }
            showAuthError(error.message);
          });
        },
        error_callback: (error) => {
          showAuthError("Google sign-in failed: " + (error.message || error.type || "popup closed"));
        },
      });

      function sessionExpired() {
        stopPolling();
        clearSession();
        state.token = "";
        appEl.hidden = true;
        gateEl.hidden = false;
        gateStatusEl.textContent = "Sign-in expired. Click Sign in with Google.";
        gateStatusEl.className = "err";
      }
      onSessionExpired = sessionExpired;

      function useToken(token, action) {
        const job = action === "setup" ? setupDatabase : enterApp;
        job(token).catch((error) => {
          if (String(error.message).startsWith("401")) {
            sessionExpired();
            return;
          }
          showAuthError(error.message);
        });
      }

      function requestSignIn() {
        tokenClient.requestAccessToken({ prompt: needConsent ? "consent" : "" });
      }

      const saved = readSession();
      if (saved) useToken(saved.access_token, "read");

      button.addEventListener("click", () => {
        nextAction = "read";
        gateStatusEl.textContent = "";
        const session = readSession();
        if (session) {
          useToken(session.access_token, "read");
          return;
        }
        gateStatusEl.textContent = "Opening Google sign-in…";
        requestSignIn();
      });
      setupButton.addEventListener("click", async () => {
        resultEl.innerHTML = "";
        const accepted = await passwordMatches(passwordInput.value);
        if (!accepted) {
          setStatus("That password is not valid.", "err");
          return;
        }
        passwordInput.value = "";
        nextAction = "setup";
        const session = readSession();
        if (session) {
          setStatus("Using the saved sign-in…");
          useToken(session.access_token, "setup");
          return;
        }
        setStatus("Opening Google sign-in…");
        requestSignIn();
      });
    }

    bindApp();
    start();
  </script>
</body>
</html>
