<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAT tracker sheet test</title>
  <style>
    :root { color-scheme: light; }
    body { font: 15px/1.45 system-ui, sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
    p.hint { color: #555; margin-top: 0; }
    button { font: inherit; padding: 0.45rem 0.8rem; cursor: pointer; }
    #status { margin: 1rem 0; padding: 0.7rem 0.8rem; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; }
    #status.ok { background: #e7f6ec; }
    #status.err { background: #fdecea; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
    th { background: #fafafa; }
    code { font-size: 0.92em; }
  </style>
</head>
<body>
  <h1>SAT tracker sheet test</h1>
  <p class="hint">Signs in with Google and reads the shared spreadsheet. Use <code>https://sdaswani.github.io/sattracker/</code>.</p>
  <button id="signin" type="button">Sign in and read sheet</button>
  <div id="status">Waiting for Google sign-in.</div>
  <div id="result"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const CLIENT_ID = "1052608179455-k09jjr1nuadhvqkmeur124ur51oc1fnq.apps.googleusercontent.com";
    const SPREADSHEET_ID = "1gXffcczfI9JAaHS1EZbmsS_EwCm7vUdornbpG95g87s";
    const SHEETS_SCOPE = "https://www.googleapis.com/auth/spreadsheets";
    const SCOPE = SHEETS_SCOPE + " https://www.googleapis.com/auth/userinfo.email";
    const ALLOWED_ORIGINS = ["https://sdaswani.github.io", "http://localhost:5173"];

    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const button = document.getElementById("signin");

    function setStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = kind || "";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    async function api(path, token) {
      const response = await fetch("https://sheets.googleapis.com/v4/spreadsheets/" + path, {
        headers: { Authorization: "Bearer " + token },
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        const message = body.error?.message || response.statusText;
        throw new Error(response.status + " " + message);
      }
      return body;
    }

    function renderSheet(meta, values) {
      const title = meta.properties?.title || "(untitled)";
      const tabs = (meta.sheets || []).map((sheet) => sheet.properties?.title).filter(Boolean);
      const rows = values.values || [];
      let html = "<p>Reached <strong>" + escapeHtml(title) + "</strong>. Tabs: " + escapeHtml(tabs.join(", ") || "(none)") + ".</p>";
      if (!rows.length) {
        html += "<p>The first tab has no cell values yet. The connection still worked.</p>";
        resultEl.innerHTML = html;
        return;
      }
      html += "<table><tbody>";
      rows.forEach((row, index) => {
        const tag = index === 0 ? "th" : "td";
        html += "<tr>" + row.map((cell) => "<" + tag + ">" + escapeHtml(cell) + "</" + tag + ">").join("") + "</tr>";
      });
      html += "</tbody></table>";
      resultEl.innerHTML = html;
    }

    async function signedInEmail(token) {
      const response = await fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
        headers: { Authorization: "Bearer " + token },
      });
      if (!response.ok) return "";
      const profile = await response.json();
      return profile.email || "";
    }

    async function readSheet(token) {
      setStatus("Signed in. Reading the spreadsheet…");
      const meta = await api(SPREADSHEET_ID + "?fields=properties.title,sheets.properties.title", token);
      const firstTab = meta.sheets?.[0]?.properties?.title || "Sheet1";
      const range = encodeURIComponent(firstTab + "!A1:Z30");
      const values = await api(SPREADSHEET_ID + "/values/" + range, token);
      const email = await signedInEmail(token);
      setStatus(email ? "Connected as " + email + "." : "Connected. Sheets access works.", "ok");
      renderSheet(meta, values);
    }

    function start() {
      if (!window.google?.accounts?.oauth2) {
        setTimeout(start, 50);
        return;
      }
      if (!ALLOWED_ORIGINS.includes(location.origin)) {
        setStatus("Open https://sdaswani.github.io/sattracker/ so Google sign-in can run. This page is " + location.origin + ".", "err");
        button.disabled = true;
        return;
      }
      let askedForSheets = false;
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: (response) => {
          if (response.error) {
            setStatus("Google sign-in failed: " + response.error, "err");
            return;
          }
          const granted = response.scope || "";
          if (!granted.includes(SHEETS_SCOPE)) {
            if (!askedForSheets) {
              askedForSheets = true;
              setStatus("Google signed you in without Sheets access. Asking for that permission…");
              tokenClient.requestAccessToken({ prompt: "consent" });
              return;
            }
            setStatus("Google did not grant Sheets access. On the consent screen, allow the spreadsheets permission, then try again.\nGranted: " + (granted || "(none)"), "err");
            return;
          }
          readSheet(response.access_token).catch((error) => {
            resultEl.innerHTML = "";
            setStatus(error.message + (granted ? "\nGranted: " + granted : ""), "err");
          });
        },
        error_callback: (error) => {
          setStatus("Google sign-in failed: " + (error.message || error.type || "popup closed"), "err");
        },
      });
      button.addEventListener("click", () => {
        resultEl.innerHTML = "";
        askedForSheets = false;
        setStatus("Opening Google sign-in…");
        tokenClient.requestAccessToken({ prompt: "consent" });
      });
    }

    start();
  </script>
</body>
</html>
